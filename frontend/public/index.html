<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fictophiliac | The Literary Cave by Saachi Iyer</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fdf8f6',
              100: '#f2e8e5',
              500: '#e06b53',
              600: '#c8523a',
              700: '#a33c27',
              900: '#1e1b18',
            },
            amberGlow: '#d97706',
            darkCard: '#151518',
            darkBg: '#08080a',
          },
          fontFamily: {
            cave: ['"Cinzel"', '"Playfair Display"', 'Georgia', 'serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #151518; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 9999px; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animate-float { animation: floatSlow 4s ease-in-out infinite; }
    @keyframes bounceDot {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .bounce-1 { animation: bounceDot 1.4s infinite ease-in-out both; animation-delay: -0.32s; }
    .bounce-2 { animation: bounceDot 1.4s infinite ease-in-out both; animation-delay: -0.16s; }
    .bounce-3 { animation: bounceDot 1.4s infinite ease-in-out both; }

    /* Flip Card Animation */
    .perspective-1000 { perspective: 1000px; }
    .card-flipper {
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card-flipped { transform: rotateY(180deg); }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen selection:bg-brand-500 selection:text-white font-sans antialiased overflow-x-hidden">
  <div id="root"></div>

  <!-- React JSX Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const API_BASE = '/api/v1';

    // ----------------------------------------------------
    // Root Application Component
    // ----------------------------------------------------
    function App() {
      // Main view state: 'landing' (Hero + Hub) | 'chat' | 'news' | 'creator'
      const [currentView, setCurrentView] = useState('hub');
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      
      // Modals
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [isLibraryOpen, setIsLibraryOpen] = useState(false);
      const [isWishlistOpen, setIsWishlistOpen] = useState(false);
      const [isRecommendModalOpen, setIsRecommendModalOpen] = useState(false);

      // User State
      const [user, setUser] = useState({ name: 'Saachi & Fellow Bookworms', signedIn: true });
      const [apiStatus, setApiStatus] = useState(null);

      // Book State
      const [recommendations, setRecommendations] = useState([]);
      const [replacingIndex, setReplacingIndex] = useState(null);
      const [curatedCategories, setCuratedCategories] = useState([]);
      const [communityReviews, setCommunityReviews] = useState([]);

      // Read Books & Wishlist persisted in localStorage
      const [readBooks, setReadBooks] = useState(() => {
        try {
          const s = localStorage.getItem('fictophiliac_read_books');
          return s ? JSON.parse(s) : [];
        } catch { return []; }
      });

      const [wishlist, setWishlist] = useState(() => {
        try {
          const s = localStorage.getItem('fictophiliac_wishlist');
          return s ? JSON.parse(s) : [
            {
              title: "Daisy Darker",
              author: "Alice Feeney",
              genre: "Psychological Thriller",
              cover_url: "https://covers.openlibrary.org/b/id/13231964-M.jpg"
            },
            {
              title: "Prophet Song",
              author: "Paul Lynch",
              genre: "Dystopian / Booker Winner",
              cover_url: "https://covers.openlibrary.org/b/id/14814200-M.jpg"
            }
          ];
        } catch { return []; }
      });

      useEffect(() => {
        try { localStorage.setItem('fictophiliac_read_books', JSON.stringify(readBooks)); } catch (e) {}
      }, [readBooks]);

      useEffect(() => {
        try { localStorage.setItem('fictophiliac_wishlist', JSON.stringify(wishlist)); } catch (e) {}
      }, [wishlist]);

      // Chat Messages
      const [chatStep, setChatStep] = useState(1);
      const [isTyping, setIsTyping] = useState(false);
      const [messages, setMessages] = useState([]);
      const [userProfile, setUserProfile] = useState({
        previousReads: [],
        favoriteAuthors: [],
        preferredGenres: [],
      });

      // Fetch health, curated shelves, & reviews on mount
      useEffect(() => {
        fetch(`${API_BASE}/health`)
          .then(r => r.json()).then(d => setApiStatus(d)).catch(err => console.warn(err));
        fetch(`${API_BASE}/curated`)
          .then(r => r.json()).then(d => setCuratedCategories(d.categories || [])).catch(err => console.warn(err));
        fetch(`${API_BASE}/community/reviews`)
          .then(r => r.json()).then(d => setCommunityReviews(d || [])).catch(err => console.warn(err));

        const hour = new Date().getHours();
        let timeOfDay = 'Good evening';
        if (hour >= 5 && hour < 12) timeOfDay = 'Good morning';
        else if (hour >= 12 && hour < 17) timeOfDay = 'Good afternoon';

        setMessages([
          {
            sender: 'bot',
            text: `Hi, ${timeOfDay}! 📖 I am Fictophiliac, your GenAI reading concierge created by Saachi Iyer.\n\nWelcome to my Literary Cave! To get started, what are 1 to 3 books you've loved recently?`,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            quickPicks: {
              type: 'reads',
              items: [
                'Daisy Darker by Alice Feeney',
                'And Then There Were None by Agatha Christie',
                'The Love Hypothesis by Ali Hazelwood',
                'The Housemaid by Freida McFadden'
              ]
            }
          }
        ]);
      }, []);

      // Toggle Wishlist
      const toggleWishlist = (book) => {
        const exists = wishlist.some(b => b.title.toLowerCase() === book.title.toLowerCase());
        if (exists) {
          setWishlist(prev => prev.filter(b => b.title.toLowerCase() !== book.title.toLowerCase()));
        } else {
          setWishlist(prev => [book, ...prev]);
        }
      };

      const isWishlisted = (title) => {
        return wishlist.some(b => b.title.toLowerCase() === title.toLowerCase());
      };

      // Mark as Read & Replace
      const handleMarkAsRead = async (index, book) => {
        const entry = {
          title: book.title,
          author: book.author,
          genre: book.genre,
          markedAt: new Date().toLocaleDateString(),
        };
        setReadBooks(prev => [entry, ...prev.filter(b => b.title.toLowerCase() !== book.title.toLowerCase())]);
        
        // Remove from wishlist if read
        setWishlist(prev => prev.filter(b => b.title.toLowerCase() !== book.title.toLowerCase()));

        setReplacingIndex(index);
        try {
          const res = await fetch(`${API_BASE}/recommendations/replace`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              read_book: book.title,
              previous_reads: userProfile.previousReads,
              favorite_authors: userProfile.favoriteAuthors,
              preferred_genres: userProfile.preferredGenres,
              excluded_titles: readBooks.map(b => b.title).concat([book.title]),
            }),
          });
          const replacement = await res.json();
          setRecommendations(prev => {
            const next = [...prev];
            next[index] = replacement;
            return next;
          });
        } catch (err) {
          console.error(err);
        } finally {
          setReplacingIndex(null);
        }
      };

      const handleSendMessage = (text) => {
        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        setMessages(prev => [...prev, { sender: 'user', text, time: now }]);

        if (chatStep === 1) {
          const reads = text.split(/,|\sand\s/i).map(r => r.trim()).filter(Boolean);
          setUserProfile(p => ({ ...p, previousReads: reads }));
          setChatStep(2);

          setIsTyping(true);
          setTimeout(() => {
            setIsTyping(false);
            setMessages(prev => [
              ...prev,
              {
                sender: 'bot',
                text: `Splendid choices! Those have fantastic pacing and narrative twists.\n\nNext: Who are 1 to 3 of your all-time favorite authors?`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                quickPicks: {
                  type: 'authors',
                  items: ['Holly Jackson', 'Agatha Christie', 'Freida McFadden', 'Lucy Foley']
                }
              }
            ]);
          }, 700);
        } else if (chatStep === 2) {
          const authors = text.split(/,|\sand\s/i).map(a => a.trim()).filter(Boolean);
          setUserProfile(p => ({ ...p, favoriteAuthors: authors }));
          setChatStep(3);

          setIsTyping(true);
          setTimeout(() => {
            setIsTyping(false);
            setMessages(prev => [
              ...prev,
              {
                sender: 'bot',
                text: `Terrific authors! Christie and McFadden are masters of high-stakes suspense.\n\nFinally, what genres or tropes are you in the mood for right now?`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                quickPicks: { type: 'genres' }
              }
            ]);
          }, 700);
        } else if (chatStep === 3) {
          const genres = text.split(/,|\sand\s/i).map(g => g.trim()).filter(Boolean);
          const updated = { ...userProfile, preferredGenres: genres };
          setUserProfile(updated);
          setChatStep(4);
          triggerGeneration(updated);
        } else {
          setIsTyping(true);
          setTimeout(() => {
            setIsTyping(false);
            triggerGeneration(userProfile);
          }, 800);
        }
      };

      const handleSkipStep = () => {
        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        setMessages(prev => [...prev, { sender: 'user', text: '⏩ Skipped this question', time: now }]);

        if (chatStep === 1) {
          setChatStep(2);
          setIsTyping(true);
          setTimeout(() => {
            setIsTyping(false);
            setMessages(prev => [
              ...prev,
              {
                sender: 'bot',
                text: `No problem at all! Who are 1 to 3 of your favorite authors?`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                quickPicks: {
                  type: 'authors',
                  items: ['Holly Jackson', 'Agatha Christie', 'Freida McFadden']
                }
              }
            ]);
          }, 600);
        } else if (chatStep === 2) {
          setChatStep(3);
          setIsTyping(true);
          setTimeout(() => {
            setIsTyping(false);
            setMessages(prev => [
              ...prev,
              {
                sender: 'bot',
                text: `Skipped! What genres or reading vibes are you craving today?`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                quickPicks: { type: 'genres' }
              }
            ]);
          }, 600);
        } else if (chatStep === 3) {
          setChatStep(4);
          triggerGeneration(userProfile);
        }
      };

      const triggerGeneration = async (profile) => {
        setIsTyping(true);
        try {
          const res = await fetch(`${API_BASE}/recommendations/recommend`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              previous_reads: profile.previousReads,
              favorite_authors: profile.favoriteAuthors,
              preferred_genres: profile.preferredGenres.length ? profile.preferredGenres : ['Psychological Thriller', 'Mystery'],
              excluded_titles: readBooks.map(b => b.title),
              count: 6,
            }),
          });
          const data = await res.json();
          setRecommendations(data.recommendations || []);
          setMessages(prev => [
            ...prev,
            {
              sender: 'bot',
              text: `✨ I've calibrated your tastes with Gemini! Here are your handpicked recommendations.\n\n• Tap the 🤍 heart to add to your Wishlist\n• Tap "Mark as Read & Replace" on any card to swap it for a fresh alternative!`,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            }
          ]);
        } catch (err) {
          console.error(err);
        } finally {
          setIsTyping(false);
        }
      };

      return (
        <div className="relative min-h-screen bg-darkBg text-zinc-100 flex flex-col font-sans">
          
          {/* Top Bar with Sidebar Trigger */}
          <nav className="border-b border-zinc-800/80 bg-zinc-950/70 backdrop-blur-md sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <button
                  onClick={() => setIsSidebarOpen(true)}
                  className="p-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white hover:border-zinc-700 transition"
                  title="Open Navigation Menu"
                >
                  <i className="fa-solid fa-bars text-sm"></i>
                </button>
                <div 
                  onClick={() => {
                    setCurrentView('hub');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                  }}
                  className="flex items-center space-x-2.5 cursor-pointer group"
                >
                  <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 to-amberGlow flex items-center justify-center text-white text-xs shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
                    <i className="fa-solid fa-book-bookmark"></i>
                  </div>
                  <span className="font-serif font-bold text-lg tracking-tight bg-gradient-to-r from-zinc-100 via-zinc-200 to-zinc-400 bg-clip-text text-transparent">
                    Fictophiliac
                  </span>
                </div>
              </div>

              {/* View Switcher Pills */}
              <div className="hidden md:flex items-center bg-zinc-900/90 border border-zinc-800 p-1 rounded-xl text-xs">
                <button
                  onClick={() => setCurrentView('hub')}
                  className={`px-3 py-1.5 rounded-lg transition ${
                    currentView === 'hub' ? 'bg-brand-600 text-white font-medium shadow-sm' : 'text-zinc-400 hover:text-zinc-200'
                  }`}
                >
                  Literary Cave
                </button>
                <button
                  onClick={() => setCurrentView('chat')}
                  className={`px-3 py-1.5 rounded-lg transition ${
                    currentView === 'chat' ? 'bg-brand-600 text-white font-medium shadow-sm' : 'text-zinc-400 hover:text-zinc-200'
                  }`}
                >
                  Concierge Chat
                </button>
                <button
                  onClick={() => setCurrentView('news')}
                  className={`px-3 py-1.5 rounded-lg transition ${
                    currentView === 'news' ? 'bg-brand-600 text-white font-medium shadow-sm' : 'text-zinc-400 hover:text-zinc-200'
                  }`}
                >
                  Spotlights
                </button>
                <button
                  onClick={() => setCurrentView('creator')}
                  className={`px-3 py-1.5 rounded-lg transition ${
                    currentView === 'creator' ? 'bg-brand-600 text-white font-medium shadow-sm' : 'text-zinc-400 hover:text-zinc-200'
                  }`}
                >
                  About Me
                </button>
              </div>

              {/* Right Shortcut Icons */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setIsWishlistOpen(true)}
                  className="p-2 rounded-xl bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-800 text-rose-400 hover:text-rose-300 transition relative"
                  title="My Wishlist"
                >
                  <i className="fa-solid fa-heart text-sm"></i>
                  {wishlist.length > 0 && (
                    <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] font-bold flex items-center justify-center">
                      {wishlist.length}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setIsLibraryOpen(true)}
                  className="p-2 rounded-xl bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-800 text-emerald-400 hover:text-emerald-300 transition relative"
                  title="My Library"
                >
                  <i className="fa-solid fa-book-open text-sm"></i>
                  {readBooks.length > 0 && (
                    <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-emerald-500 text-white text-[9px] font-bold flex items-center justify-center">
                      {readBooks.length}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </nav>

          {/* MAIN VIEW CONTROLLER */}
          <main className="flex-1 w-full">
            {currentView === 'hub' && (
              <HubLandingView
                onExploreCave={() => {
                  const el = document.getElementById('cave-hub-content');
                  el?.scrollIntoView({ behavior: 'smooth' });
                }}
                onOpenChat={() => {
                  setCurrentView('chat');
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                }}
                onOpenNews={() => {
                  setCurrentView('news');
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                }}
                onOpenCreator={() => {
                  setCurrentView('creator');
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                }}
                reviews={communityReviews}
                categories={curatedCategories}
                onSelectBookForChat={(book) => {
                  setCurrentView('chat');
                  handleSendMessage(`I'm curious about "${book.title}" by ${book.author} (${book.badge}). Can you recommend similar books?`);
                }}
              />
            )}

            {currentView === 'chat' && (
              <div className="max-w-7xl mx-auto px-4 py-6">
                <ChatbotWindow
                  messages={messages}
                  isTyping={isTyping}
                  onSendMessage={handleSendMessage}
                  onSkipStep={handleSkipStep}
                  chatStep={chatStep}
                  recommendations={recommendations}
                  replacingIndex={replacingIndex}
                  onMarkAsRead={handleMarkAsRead}
                  onToggleWishlist={toggleWishlist}
                  isWishlisted={isWishlisted}
                  onResetChat={() => {
                    setChatStep(1);
                    setRecommendations([]);
                    setUserProfile({ previousReads: [], favoriteAuthors: [], preferredGenres: [] });
                    setMessages([
                      {
                        sender: 'bot',
                        text: `Restarted! What are 1 to 3 books you've loved recently?`,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        quickPicks: {
                          type: 'reads',
                          items: [
                            'Daisy Darker by Alice Feeney',
                            'And Then There Were None by Agatha Christie',
                            'The Love Hypothesis by Ali Hazelwood'
                          ]
                        }
                      }
                    ]);
                  }}
                />
              </div>
            )}

            {currentView === 'news' && (
              <div className="max-w-7xl mx-auto px-4 py-8">
                <CuratedNewsSection
                  categories={curatedCategories}
                  onSelectBookForChat={(book) => {
                    setCurrentView('chat');
                    handleSendMessage(`I'm curious about "${book.title}" by ${book.author} (${book.badge}). Can you recommend similar books?`);
                  }}
                  onToggleWishlist={toggleWishlist}
                  isWishlisted={isWishlisted}
                />
              </div>
            )}

            {currentView === 'creator' && (
              <div className="max-w-7xl mx-auto px-4 py-8">
                <AboutMeSection
                  onConsultTaste={() => {
                    setCurrentView('chat');
                    handleSendMessage(`I'd love recommendations matching Saachi's taste: psychological thrillers like Daisy Darker, locked-room mysteries like Agatha Christie, and fast-paced domestic suspense like Freida McFadden!`);
                  }}
                />
              </div>
            )}
          </main>

          {/* SIDE NAVIGATION BAR */}
          <SideNavBar
            isOpen={isSidebarOpen}
            onClose={() => setIsSidebarOpen(false)}
            user={user}
            onOpenSignIn={() => { setIsSidebarOpen(false); setIsAuthModalOpen(true); }}
            onOpenLibrary={() => { setIsSidebarOpen(false); setIsLibraryOpen(true); }}
            onOpenWishlist={() => { setIsSidebarOpen(false); setIsWishlistOpen(true); }}
            onOpenRecommend={() => { setIsSidebarOpen(false); setIsRecommendModalOpen(true); }}
            onNavigate={(view) => { setIsSidebarOpen(false); setCurrentView(view); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
            readCount={readBooks.length}
            wishlistCount={wishlist.length}
          />

          {/* MODALS */}
          <AuthModal
            isOpen={isAuthModalOpen}
            onClose={() => setIsAuthModalOpen(false)}
            user={user}
            onSignIn={(name) => { setUser({ name: name || 'Saachi & Readers', signedIn: true }); setIsAuthModalOpen(false); }}
          />

          <LibraryModal
            isOpen={isLibraryOpen}
            onClose={() => setIsLibraryOpen(false)}
            readBooks={readBooks}
            onClear={() => { setReadBooks([]); localStorage.removeItem('fictophiliac_read_books'); }}
          />

          <WishlistModal
            isOpen={isWishlistOpen}
            onClose={() => setIsWishlistOpen(false)}
            wishlist={wishlist}
            onRemove={(book) => toggleWishlist(book)}
            onConsultBook={(book) => {
              setIsWishlistOpen(false);
              setCurrentView('chat');
              handleSendMessage(`I have "${book.title}" in my Wishlist. Can you tell me what makes it worth reading?`);
            }}
          />

          <RecommendBookModal
            isOpen={isRecommendModalOpen}
            onClose={() => setIsRecommendModalOpen(false)}
          />

        </div>
      );
    }

    // ----------------------------------------------------
    // 1. HUB & LANDING HERO VIEW
    // ----------------------------------------------------
    function HubLandingView({
      onExploreCave,
      onOpenChat,
      onOpenNews,
      onOpenCreator,
      reviews,
      categories,
      onSelectBookForChat
    }) {
      return (
        <div className="w-full flex flex-col items-center">
          
          {/* HERO BANNER SECTION */}
          <section className="relative w-full min-h-[90vh] flex flex-col items-center justify-center text-center px-4 py-16 overflow-hidden">
            {/* Atmospheric Background Glows */}
            <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[650px] h-[400px] bg-gradient-to-b from-brand-600/20 via-amberGlow/15 to-transparent rounded-full blur-[120px] pointer-events-none"></div>
            <div className="absolute -bottom-24 -left-24 w-80 h-80 bg-brand-700/10 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -top-24 -right-24 w-80 h-80 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div className="relative z-10 max-w-5xl mx-auto space-y-6">
              {/* Badge */}

                    return next;
                  });

              <h3 className="font-serif font-bold text-base text-zinc-100">My Go-To Authors</h3>

              <h3 className="font-serif font-bold text-base text-zinc-100">My Reading Philosophy</h3>

    // ----------------------------------------------------
    // 3. CHATBOT WINDOW WITH WISHLIST HEARTS & REPLACE
    // ----------------------------------------------------
    function ChatbotWindow({
      messages,
      isTyping,
      onSendMessage,
      onSkipStep,
      chatStep,
      recommendations,
      replacingIndex,
      onMarkAsRead,
      onToggleWishlist,
      isWishlisted,
      onResetChat,
    }) {
      const [inputVal, setInputVal] = useState('');
      const [selectedGenres, setSelectedGenres] = useState([]);
      const chatEndRef = useRef(null);

      const toggleGenre = (genreWithIcon) => {
        const cleanGenre = genreWithIcon.replace(/^[^\w]+/, '').trim();
        setSelectedGenres((prev) => {
          if (prev.includes(cleanGenre)) {
            return prev.filter((g) => g !== cleanGenre);
          } else {
            return [...prev, cleanGenre];
          }
        });
      };

      const handleDoneGenres = () => {
        if (selectedGenres.length === 0) return;
        onSendMessage(selectedGenres.join(', '));
        setSelectedGenres([]);
      };

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isTyping, recommendations]);

      const handleSend = (e) => {
        e?.preventDefault();
        if (!inputVal.trim()) return;
        onSendMessage(inputVal.trim());
        setInputVal('');
      };

      const genreSuggestions = [
        '⚡ Psychological Thriller',
        '🔍 Mystery / Whodunit',
        '💖 Contemporary Romance',
        '🚪 Locked Room Mystery',
        '🏡 Domestic Suspense',
        '🥀 Dark Romance',
        '✨ Fantasy / Magic'
      ];

      return (
        <div className="w-full max-w-4xl mx-auto flex flex-col h-[calc(100vh-8.5rem)] bg-darkCard/95 border border-zinc-800/90 rounded-2xl shadow-2xl overflow-hidden backdrop-blur-xl animate-fade-in">
          {/* Header */}
          <div className="px-6 py-3.5 border-b border-zinc-800/80 bg-zinc-900/80 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="relative">
                <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-brand-600 to-amberGlow flex items-center justify-center text-white text-sm shadow-md">
                  <i className="fa-solid fa-sparkles"></i>
                </div>
                <span className="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-400 ring-2 ring-zinc-900"></span>
              </div>
              <div>
                <h3 className="font-serif font-bold text-sm text-zinc-100 flex items-center space-x-2">
                  <span>Fictophiliac</span>
                  <span className="text-[10px] font-sans px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-300 font-medium">GenAI Concierge</span>
                </h3>
                <p className="text-[11px] text-zinc-400">Created by Saachi Iyer • Calibrated for bookworms</p>
              </div>
            </div>

            <button
              onClick={onResetChat}
              className="text-xs px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 transition flex items-center space-x-1.5"
            >
              <i className="fa-solid fa-rotate-right text-xs"></i>
              <span>New Conversation</span>
            </button>
          </div>

          {/* Messages Feed */}
          <div className="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-5">
            {messages.map((msg, index) => (
              <div
                key={index}
                className={`flex items-start space-x-3 ${msg.sender === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`}
              >
                {msg.sender === 'bot' && (
                  <div className="w-8 h-8 rounded-full bg-brand-600/30 border border-brand-500/40 flex-shrink-0 flex items-center justify-center text-brand-400 text-xs mt-1">
                    <i className="fa-solid fa-robot"></i>
                  </div>
                )}

                <div
                  className={`max-w-xl rounded-2xl px-4 py-3 text-sm leading-relaxed shadow-sm ${
                    msg.sender === 'user'
                      ? 'bg-gradient-to-br from-brand-600 to-brand-700 text-white rounded-tr-none'
                      : 'bg-zinc-900/90 border border-zinc-800 text-zinc-200 rounded-tl-none'
                  }`}
                >
                  <p className="whitespace-pre-line">{msg.text}</p>

                  {/* Suggestion Chips */}
                  {msg.quickPicks && msg.quickPicks.type === 'reads' && chatStep === 1 && (
                    <div className="mt-3 pt-2.5 border-t border-zinc-800/80 flex flex-wrap gap-1.5">
                      <span className="text-[11px] text-zinc-400 w-full mb-1">Quick tap to select:</span>
                      {msg.quickPicks.items.map((item, i) => (
                        <button
                          key={i}
                          onClick={() => onSendMessage(item)}
                          className="text-[11px] px-2.5 py-1 rounded-full bg-zinc-800 hover:bg-brand-600 hover:text-white text-zinc-300 border border-zinc-700 transition"
                        >
                          + {item}
                        </button>
                      ))}
                    </div>
                  )}

                  {msg.quickPicks && msg.quickPicks.type === 'authors' && chatStep === 2 && (
                    <div className="mt-3 pt-2.5 border-t border-zinc-800/80 flex flex-wrap gap-1.5">
                      <span className="text-[11px] text-zinc-400 w-full mb-1">Popular author suggestions:</span>
                      {msg.quickPicks.items.map((author, i) => (
                        <button
                          key={i}
                          onClick={() => onSendMessage(author)}
                          className="text-[11px] px-2.5 py-1 rounded-full bg-zinc-800 hover:bg-brand-600 hover:text-white text-zinc-300 border border-zinc-700 transition"
                        >
                          <i className="fa-solid fa-pen-nib mr-1 text-[10px]"></i>
                          {author}
                        </button>
                      ))}
                    </div>
                  )}

                  {msg.quickPicks && msg.quickPicks.type === 'genres' && chatStep === 3 && (
                    <div className="mt-3 pt-3 border-t border-zinc-800/80 space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs text-zinc-300 font-medium">
                          Select one or more reading vibes:
                        </span>
                        {selectedGenres.length > 0 && (
                          <span className="text-[11px] text-brand-400 font-semibold px-2.5 py-0.5 rounded-full bg-brand-500/10 border border-brand-500/25">
                            {selectedGenres.length} selected
                          </span>
                        )}
                      </div>

                      <div className="flex flex-wrap gap-2">
                        {genreSuggestions.map((g, i) => {
                          const clean = g.replace(/^[^\w]+/, '').trim();
                          const isSelected = selectedGenres.includes(clean);
                          return (
                            <button
                              key={i}
                              type="button"
                              onClick={() => toggleGenre(g)}
                              className={`text-xs px-3 py-1.5 rounded-xl border transition-all duration-200 flex items-center space-x-1.5 cursor-pointer ${
                                isSelected
                                  ? 'bg-gradient-to-r from-brand-600 to-amber-600 text-white border-amber-500/70 shadow-md shadow-brand-600/30 font-semibold scale-[1.02]'
                                  : 'bg-zinc-800/90 hover:bg-zinc-700/80 text-zinc-300 border-zinc-700 hover:border-zinc-600'
                              }`}
                            >
                              <span>{g}</span>
                              {isSelected && <i className="fa-solid fa-check text-[11px] ml-1"></i>}
                            </button>
                          );
                        })}
                      </div>

                      {/* Done Button to Trigger Selection */}
                      <div className="pt-1 flex items-center justify-between gap-3">
                        <button
                          type="button"
                          onClick={handleDoneGenres}
                          disabled={selectedGenres.length === 0}
                          className={`px-5 py-2.5 rounded-xl text-xs font-semibold flex items-center space-x-2 transition-all duration-200 shadow-md ${
                            selectedGenres.length > 0
                              ? 'bg-gradient-to-r from-brand-600 to-amber-500 hover:from-brand-500 hover:to-amber-400 text-white shadow-brand-500/30 cursor-pointer'
                              : 'bg-zinc-800 text-zinc-500 border border-zinc-700/60 cursor-not-allowed'
                          }`}
                        >
                          <i className="fa-solid fa-sparkles text-xs"></i>
                          <span>
                            {selectedGenres.length > 0
                              ? `Done • Get Recommendations (${selectedGenres.length} selected)`
                              : 'Select 1 or more genres above'}
                          </span>
                        </button>

                        <button
                          type="button"
                          onClick={onSkipStep}
                          className="text-xs text-zinc-400 hover:text-zinc-200 px-3 py-1.5 rounded-lg hover:bg-zinc-800/60 transition"
                        >
                          Skip step &rarr;
                        </button>
                      </div>
                    </div>
                  )}

                  <span className="block text-[10px] text-zinc-500 mt-1.5 text-right">
                    {msg.time}
                  </span>
                </div>

                {msg.sender === 'user' && (
                  <div className="w-8 h-8 rounded-full bg-zinc-700 flex-shrink-0 flex items-center justify-center text-zinc-300 text-xs mt-1">
                    <i className="fa-solid fa-user"></i>
                  </div>
                )}
              </div>
            ))}

            {isTyping && (
              <div className="flex items-center space-x-3 animate-fade-in">
                <div className="w-8 h-8 rounded-full bg-brand-600/30 border border-brand-500/40 flex items-center justify-center text-brand-400 text-xs">
                  <i className="fa-solid fa-robot"></i>
                </div>
                <div className="bg-zinc-900 border border-zinc-800 rounded-2xl rounded-tl-none px-4 py-3 flex items-center space-x-1.5">
                  <div className="w-2 h-2 rounded-full bg-brand-400 bounce-1"></div>
                  <div className="w-2 h-2 rounded-full bg-brand-400 bounce-2"></div>
                  <div className="w-2 h-2 rounded-full bg-brand-400 bounce-3"></div>
                  <span className="text-xs text-zinc-400 ml-2">Fictophiliac is consulting Gemini AI...</span>
                </div>
              </div>
            )}

            {/* Recommendations Stream */}
            {recommendations && recommendations.length > 0 && (
              <div className="pt-4 space-y-4 animate-fade-in">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-2">
                  <h4 className="font-serif font-bold text-base text-zinc-200 flex items-center space-x-2">
                    <i className="fa-solid fa-book-sparkles text-brand-400"></i>
                    <span>Your Handpicked Recommendations ({recommendations.length})</span>
                  </h4>
                  <span className="text-[11px] text-emerald-400 font-medium">
                    ✓ Tap &quot;Mark as Read&quot; to replace any book
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {recommendations.map((book, idx) => (
                    <BookCard
                      key={`${book.title}-${idx}`}
                      index={idx}
                      book={book}
                      isReplacing={replacingIndex === idx}
                      onMarkAsRead={onMarkAsRead}
                      onToggleWishlist={onToggleWishlist}
                      isWishlisted={isWishlisted(book.title)}
                    />
                  ))}
                </div>
              </div>
            )}

            <div ref={chatEndRef} />
          </div>

          {/* Quick Skip Bar */}
          {chatStep >= 1 && chatStep <= 3 && (
            <div className="px-6 py-2 bg-zinc-900/60 border-t border-zinc-800/60 flex items-center justify-between text-xs text-zinc-400">
              <span>
                {chatStep === 1 && "Step 1 of 3: Past Reads"}
                {chatStep === 2 && "Step 2 of 3: Favorite Authors"}
                {chatStep === 3 && "Step 3 of 3: Genres & Moods"}
              </span>
              <button
                onClick={onSkipStep}
                className="text-brand-400 hover:text-brand-300 font-medium transition flex items-center space-x-1"
              >
                <span>Skip this question</span>
                <i className="fa-solid fa-forward-step text-[10px]"></i>
              </button>
            </div>
          )}

          {/* Input Bar */}
          <form onSubmit={handleSend} className="p-4 border-t border-zinc-800 bg-zinc-900/90 flex items-center space-x-3">
            <input
              type="text"
              value={inputVal}
              onChange={(e) => setInputVal(e.target.value)}
              placeholder={
                chatStep === 1
                  ? "e.g. Daisy Darker by Alice Feeney, And Then There Were None..."
                  : chatStep === 2
                  ? "e.g. Holly Jackson, Agatha Christie, Freida McFadden..."
                  : chatStep === 3
                  ? "e.g. Psychological Thriller, Mystery, Romance..."
                  : "Ask Fictophiliac about a book or request more recommendations..."
              }
              className="flex-1 px-4 py-2.5 bg-zinc-800/90 border border-zinc-700/80 rounded-xl text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-brand-500 transition"
            />
            <button
              type="submit"
              disabled={!inputVal.trim() && !isTyping}
              className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 disabled:opacity-40 text-white font-medium text-sm transition shadow-lg shadow-brand-600/20 flex items-center space-x-2"
            >
              <span>Send</span>
              <i className="fa-solid fa-paper-plane text-xs"></i>
            </button>
          </form>
        </div>
      );
    }

    // ----------------------------------------------------
    // BOOK CARD WITH WISHLIST HEART & TOOLTIP
    // ----------------------------------------------------
    function BookCard({ book, index, isReplacing, onMarkAsRead, onToggleWishlist, isWishlisted }) {
      if (isReplacing) {
        return (
          <div className="bg-darkCard border border-emerald-500/40 rounded-2xl p-5 min-h-[360px] flex flex-col items-center justify-center space-y-3 text-center animate-pulse">
            <div className="w-8 h-8 rounded-full border-2 border-emerald-500/30 border-t-emerald-500 animate-spin"></div>
            <h4 className="text-sm font-semibold text-emerald-300">
              Marked as read!
            </h4>
            <p className="text-xs text-zinc-400 max-w-xs">
              Fictophiliac is selecting an alternative recommendation...
            </p>
          </div>
        );
      }

      const fallbackCover = `https://placehold.co/300x450/1e293b/f8fafc?text=${encodeURIComponent(book.title.slice(0, 20))}`;

      return (
        <div className="group relative bg-darkCard border border-zinc-800/90 hover:border-brand-500/50 rounded-2xl overflow-hidden p-4 flex flex-col justify-between transition-all duration-300 hover:shadow-xl hover:shadow-brand-500/10 animate-fade-in">
          <div>
            <div className="flex space-x-3.5 relative">
              <div className="w-20 sm:w-24 h-32 sm:h-36 rounded-lg overflow-hidden flex-shrink-0 bg-zinc-800 shadow-md border border-zinc-700/60 relative">
                <img
                  src={book.cover_url || fallbackCover}
                  alt={book.title}
                  loading="lazy"
                  onError={(e) => {
                    e.target.onerror = null;
                    e.target.src = fallbackCover;
                  }}
                  className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                />
              </div>

              <div className="flex-1 min-w-0 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between">
                    <span className="inline-block text-[10px] font-semibold tracking-wider uppercase px-2 py-0.5 rounded bg-brand-500/15 text-brand-300 border border-brand-500/25 mb-1">
                      {book.genre || 'Fiction'}
                    </span>

                    {/* WISHLIST HEART WITH HOVER TOOLTIP */}
                    <div className="relative group/heart">
                      <button
                        onClick={() => onToggleWishlist(book)}
                        className={`p-1.5 rounded-lg transition ${
                          isWishlisted ? 'text-rose-500 hover:text-rose-400' : 'text-zinc-500 hover:text-rose-400'
                        }`}
                        title="Add to Wishlist"
                      >
                        <i className={`${isWishlisted ? 'fa-solid' : 'fa-regular'} fa-heart text-sm`}></i>
                      </button>
                      
                      {/* Tooltip */}
                      <div className="absolute right-0 bottom-full mb-1 hidden group-hover/heart:block w-48 p-2 rounded-lg bg-zinc-950 border border-zinc-800 shadow-2xl text-[10px] text-zinc-300 z-30 pointer-events-none">
                        <span className="font-semibold text-rose-400 block mb-0.5">
                          {isWishlisted ? '❤️ In Your Wishlist' : '🤍 Add to Wishlist'}
                        </span>
                        Save this book to your reading queue to purchase or read later.
                      </div>
                    </div>
                  </div>

                  <h3 className="font-serif font-bold text-sm sm:text-base text-zinc-100 leading-snug line-clamp-2">
                    {book.title}
                  </h3>
                  <p className="text-xs text-zinc-400 font-medium mt-0.5">
                    by <span className="text-zinc-200">{book.author}</span>
                  </p>
                </div>

                <div className="text-[11px] text-zinc-500 mt-2 flex items-center">
                  <i className="fa-regular fa-file-lines mr-1.5"></i>
                  <span>{book.page_count || 'Novel'}</span>
                </div>
              </div>
            </div>

            <p className="text-xs text-zinc-300 mt-3 line-clamp-3 leading-relaxed">
              {book.summary}
            </p>

            <div className="mt-2.5 p-2 rounded-xl bg-zinc-900/90 border border-zinc-800/80">
              <p className="text-[11px] text-amber-300/90 font-medium flex items-start space-x-1.5">
                <i className="fa-solid fa-sparkles text-amber-400 flex-shrink-0 mt-0.5"></i>
                <span className="flex-1 leading-snug">{book.match_reason}</span>
              </p>
            </div>
          </div>

          <div className="mt-3.5 pt-2.5 border-t border-zinc-800/80">
            <button
              onClick={() => onMarkAsRead(index, book)}
              className="w-full py-2 px-3 rounded-xl bg-zinc-800/90 hover:bg-emerald-600/90 text-zinc-300 hover:text-white border border-zinc-700/80 hover:border-emerald-500/80 text-xs font-semibold transition-all duration-200 flex items-center justify-center space-x-1.5 shadow-sm group/btn"
            >
              <i className="fa-solid fa-check text-emerald-400 group-hover/btn:text-white"></i>
              <span>Mark as Read &amp; Replace</span>
            </button>
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // 4. CURATED NEWS & SPOTLIGHTS SECTION
    // ----------------------------------------------------
    function CuratedNewsSection({ categories, onSelectBookForChat, onToggleWishlist, isWishlisted }) {
      const [selectedCatId, setSelectedCatId] = useState(categories[0]?.id || 'booker-prize');
      const activeCategory = categories.find((c) => c.id === selectedCatId) || categories[0];

      return (
        <div className="w-full max-w-6xl mx-auto space-y-6 animate-fade-in">
          <div className="bg-gradient-to-r from-zinc-900 via-zinc-900/90 to-brand-950/40 border border-zinc-800 p-6 sm:p-8 rounded-2xl relative overflow-hidden shadow-2xl">
            <div className="relative z-10 max-w-2xl">
              <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-brand-500/10 border border-brand-500/20 text-brand-400 text-xs font-medium mb-3">
                <i className="fa-solid fa-award"></i>
                <span>Literary Gazette &amp; Bestseller Spotlight</span>
              </div>
              <h2 className="text-2xl sm:text-3xl font-serif font-bold text-zinc-100">
                Explore Prestigious Winners &amp; Chart Toppers
              </h2>
              <p className="text-xs sm:text-sm text-zinc-400 mt-2 leading-relaxed">
                Browse historic Booker Prize honorees across the years, Goodreads Choice champions, National Indian bestsellers, international blockbusters, and books headed to the silver screen.
              </p>
            </div>
          </div>

          {/* Category Tabs */}
          <div className="flex overflow-x-auto custom-scrollbar pb-2 gap-2">
            {categories.map((cat) => (
              <button
                key={cat.id}
                onClick={() => setSelectedCatId(cat.id)}
                className={`px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 border ${
                  cat.id === selectedCatId
                    ? 'bg-brand-600 text-white border-brand-500 shadow-md shadow-brand-600/20'
                    : 'bg-zinc-900/90 text-zinc-400 border-zinc-800 hover:border-zinc-700 hover:text-zinc-200'
                }`}
              >
                <i className={`fa-solid fa-${cat.icon || 'book'} text-xs`}></i>
                <span>{cat.name}</span>
              </button>

    // ----------------------------------------------------
    // 6. RECOMMEND MORE BOOKS MODAL (SEARCH OR URL FALLBACK)
    // ----------------------------------------------------
    function RecommendBookModal({ isOpen, onClose }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [isSearching, setIsSearching] = useState(false);
      const [hasSearched, setHasSearched] = useState(false);
      
      const [urlInput, setUrlInput] = useState('');
      const [isVerifyingUrl, setIsVerifyingUrl] = useState(false);
      const [feedback, setFeedback] = useState(null);

      if (!isOpen) return null;

      // Handle search recognition
      const handleSearch = async (q) => {
        setSearchQuery(q);
        if (q.trim().length < 2) {
          setSearchResults([]);
          setHasSearched(false);
          return;
        }

        setIsSearching(true);
        setHasSearched(true);
        try {
          const res = await fetch(`${API_BASE}/community/search-books?q=${encodeURIComponent(q.trim())}`);
          const data = await res.json();
          setSearchResults(data || []);
        } catch (err) {
          console.warn(err);
        } finally {
          setIsSearching(false);
        }
      };

      // Select book from search
      const handleSelectBook = async (book) => {
        try {
          await fetch(`${API_BASE}/community/submit-recommendation`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: book.title,
              author: book.author,
              source_url: 'Recognized from Search',
              note: 'Recommended by community user'
            })
          });
          setFeedback({
            type: 'success',
            message: `Awesome! "${book.title}" by ${book.author} has been submitted to our literary catalog.`
          });
        } catch (err) {
          setFeedback({ type: 'error', message: 'Could not submit recommendation. Please try again.' });
        }
      };

      // Verify URL Fallback
      const handleVerifyUrl = async (e) => {
        e.preventDefault();
        if (!urlInput.trim()) return;

        setIsVerifyingUrl(true);
        setFeedback(null);
        try {
          const res = await fetch(`${API_BASE}/community/verify-and-add-url`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urlInput.trim() })
          });
          const data = await res.json();
          if (data.verified) {
            setFeedback({ type: 'success', message: data.message });
            setUrlInput('');
          } else {
            setFeedback({ type: 'error', message: data.message });
          }
        } catch (err) {
          setFeedback({ type: 'error', message: 'Failed to verify URL. Please check the link.' });
        } finally {
          setIsVerifyingUrl(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-darkCard border border-zinc-800 rounded-3xl max-w-xl w-full p-6 sm:p-8 space-y-6 max-h-[90vh] flex flex-col shadow-2xl">
            {/* Header */}
            <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
              <div>
                <h3 className="font-serif font-bold text-lg sm:text-xl text-zinc-100 flex items-center space-x-2">
                  <i className="fa-solid fa-plus-circle text-brand-400"></i>
                  <span>Recommend a Book</span>
                </h3>
                <p className="text-xs text-zinc-400 mt-1">
                  Have an unmissable read or a hidden gem that belongs in our archives? Add it below!
                </p>
              </div>
              <button onClick={onClose} className="text-zinc-400 hover:text-zinc-200 p-1">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <div className="flex-1 overflow-y-auto custom-scrollbar space-y-6 pr-1">
              {/* Feedback Alert */}
              {feedback && (
                <div className={`p-4 rounded-2xl text-xs flex items-start space-x-2.5 ${
                  feedback.type === 'success' ? 'bg-emerald-950/80 border border-emerald-600/50 text-emerald-200' : 'bg-rose-950/80 border border-rose-600/50 text-rose-200'
                }`}>
                  <i className={`fa-solid ${feedback.type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation text-rose-400'} mt-0.5`}></i>
                  <span>{feedback.message}</span>
                </div>
              )}

              {/* 1. Search Dropdown / Recognition Field */}
              <div className="space-y-2">
                <label className="block text-xs font-semibold uppercase tracking-wider text-zinc-300">
                  Search &amp; Recognize Book Title
                </label>
                <div className="relative">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => handleSearch(e.target.value)}
                    placeholder="Type book title or author name..."
                    className="w-full pl-10 pr-4 py-3 bg-zinc-900 border border-zinc-700 rounded-xl text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-brand-500 transition"
                  />
                  <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-zinc-500 text-xs">
                    {isSearching ? <i className="fa-solid fa-spinner animate-spin"></i> : <i className="fa-solid fa-magnifying-glass"></i>}
                  </span>
                </div>

                {/* Search Results Dropdown List */}
                {searchResults.length > 0 && (
                  <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-2 space-y-1.5 shadow-xl max-h-56 overflow-y-auto custom-scrollbar">
                    {searchResults.map((b, i) => (
                      <div
                        key={i}
                        onClick={() => handleSelectBook(b)}
                        className="p-2.5 rounded-xl hover:bg-zinc-800/90 border border-transparent hover:border-zinc-700 transition flex items-center justify-between cursor-pointer group"
                      >
                        <div className="flex items-center space-x-3 min-w-0">
                          <img src={b.cover_url} alt={b.title} className="w-8 h-12 object-cover rounded shadow" />
                          <div className="min-w-0">
                            <p className="font-semibold text-xs text-zinc-200 group-hover:text-brand-300 truncate">{b.title}</p>
                            <p className="text-[11px] text-zinc-400 truncate">by {b.author} ({b.year})</p>
                          </div>
                        </div>
                        <button className="text-[11px] px-2.5 py-1 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium">
                          Add
                        </button>
                      </div>
                    ))}
                  </div>
                )}

                {hasSearched && searchResults.length === 0 && !isSearching && (
                  <p className="text-[11px] text-zinc-500 italic pl-1">
                    No matching book found in library search. Use the URL option below!
                  </p>
                )}
              </div>

              {/* 2. URL Fallback Section */}
              <div className="p-4 rounded-2xl bg-zinc-900/60 border border-zinc-800/90 space-y-3">
                <div className="flex items-center space-x-2 text-xs font-semibold text-amber-400">
                  <i className="fa-solid fa-link"></i>
                  <span>Not Able to Find the Book You Want to Recommend?</span>
                </div>
                <p className="text-xs text-zinc-400 leading-relaxed">
                  Don&apos;t worry, we got you covered. Just drop a purchase or Goodreads URL here and our app will verify if the book exists and add it to our recommendation catalog.
                </p>

                <form onSubmit={handleVerifyUrl} className="space-y-3">
                  <input
                    type="url"
                    value={urlInput}
                    onChange={(e) => setUrlInput(e.target.value)}
                    placeholder="https://www.amazon.com/dp/... or goodreads.com/book/show/..."
                    className="w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-500 transition"
                  />
                  <button
                    type="submit"
                    disabled={!urlInput.trim() || isVerifyingUrl}
                    className="w-full py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 disabled:opacity-40 text-white text-xs font-semibold transition flex items-center justify-center space-x-2 shadow-md shadow-amber-600/20"
                  >
                    {isVerifyingUrl ? (
                      <>
                        <i className="fa-solid fa-spinner animate-spin"></i>
                        <span>Verifying Book URL...</span>
                      </>
                    ) : (
                      <>
                        <i className="fa-solid fa-check-double"></i>
                        <span>Verify &amp; Add Book to Cave</span>
                      </>
                    )}
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    }

              Sign in to sync your Library, Wishlist, and Fictophiliac recommendations across devices.
            </p>

            <form onSubmit={(e) => { e.preventDefault(); onSignIn(nameInput.trim()); }} className="space-y-3">
              <input
                type="text"
                value={nameInput}
                onChange={(e) => setNameInput(e.target.value)}
                placeholder="Enter your reader name..."
                className="w-full px-4 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-xs text-zinc-100 focus:outline-none focus:border-brand-500"
              />
              <button
                type="submit"
                className="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-xs transition"
              >
                Save &amp; Continue Reading
              </button>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
